# Publishes the context package on a version tag `vX.Y.Z`. The tag equals `v` plus
# the version in package/runtime.toml. The archive is built by `xtask plugin build`
# of the pohunek core tag named below and published as a GitHub release of this
# repository with an attestation and SHA256SUMS. Both references name the core tag
# whose release published this package version; move them together.

name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    uses: zajca/pohunek/.github/workflows/plugin-release.yml@v0.42.0
    with:
      core-tag: v0.42.0
    permissions:
      contents: write
      id-token: write
      attestations: write
